
<!DOCTYPE html>
<html>
<head>
    <title>Course Management System</title>
    <link rel="stylesheet" href="coursemanage.css">
</head>
<body>

    <h1>Course Management System</h1>

    <h2>Add / Update Course</h2>

    <div class="form">
        <input type="number" id="id" placeholder="Course ID">
        <input type="text" id="name" placeholder="Course Name">
        <input type="text" id="code" placeholder="Course Code">
        <input type="text" id="dept" placeholder="Department">

        <button onclick="saveCourse()">Save Course</button>
    </div>

    <h2>Course Details</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Code</th>
                <th>Department</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="list"></tbody>
    </table>

    <script src="coursemange.js"></script>

</body>
</html>
